# Strehl analysis run configurations
# Paths are relative to the project stem
# Each run inherits defaults; override only what differs

defaults:
  fp_mask: grid_lm
  pp_mask: PPS-CFO2
  fit_simmed_psf: false
  fit_annular_aperture_free: true
  fit_annular_aperture_fixed: true
  # psfs_subset: 'all' to process all PSFs, or an integer to process only the first N PSFs
  psfs_subset: 2
  # fit_method: 'curve_fit' (default) or 'amoeba' for annular aperture free-parameter fit
  fit_method: curve_fit
  config_coords_guesses_file_name: config/config_file_IMG_04_coords_ver11.yaml
  results_write_dir: IMG_04_analysis_results/

runs:
  - filter_name: Br_alpha
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_PPS-CFO2_filter_Br_alpha.fits
    pp_mask: PPS-CFO2
    fit_method: curve_fit
    fit_annular_aperture_fixed: true
    fit_annular_aperture_free: true

  - filter_name: Br_alpha
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_PPS-CFO2_filter_Br_alpha.fits
    pp_mask: PPS-CFO2

  - filter_name: Br_alpha_ref
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_Br_alpha_ref.fits

  - filter_name: Lp
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_Lp.fits

  - filter_name: H2O-ice
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_H2O-ice.fits

  - filter_name: PAH_3.3
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_PAH_3.3.fits

  - filter_name: PAH_3.3_ref
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_PAH_3.3_ref.fits

  - filter_name: short-L
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_short-L.fits

  - filter_name: IB_4.05
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_IB_4.05.fits

  - filter_name: HCI_L_short
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_HCI_L_short.fits

  - filter_name: HCI_L_long
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_HCI_L_long.fits

  - filter_name: Mp
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_Mp.fits

  - filter_name: CO_1-0_ice
    file_name: IMG_04_simmed_data/IMG_OPT_04_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_Open_filter_CO_1-0_ice.fits

  - filter_name: CO_ref
