# IMG-RAD-09 nominal background behaviour: analysis runs (data states)
# Paths are relative to the project stem (METIS_MAIT_code_eckhart/), or absolute.
# Each run inherits defaults; override only what differs.
#
# Files as written by IMG_RAD_09_nominal_background_behavior_SIM.py
# (config/config_file_IMG_RAD_09_nominal_background_SIM.yaml):
# IMG_RAD_09_<requirement>_<band>_<pupil mask>_natural.fits, one natural 10000 s
# readout of the WCU pinhole (one PSF in the middle) per band and pupil mask, with the
# requirement (REQ_ID, REQ_LIM, ...; nothing injected, no EXPECTED) in the primary
# header. det_key: the detector (img_lm, img_n), for the pixel scale, filter wavelength
# and flux calibration.

defaults:
  req_id: SENS-10000S
  case: natural
  results_write_dir: results/IMG_RAD_09_nominal_background_analysis_results/

runs:
  - {instrument: Lp_PPS-CFO2, det_key: img_lm,
     file_name_abs: data/IMG_RAD_09_nominal_background_simmed_data/IMG_RAD_09_SENS-10000S_Lp_PPS-CFO2_natural.fits}
  - {instrument: Lp_PPS-LM, det_key: img_lm,
     file_name_abs: data/IMG_RAD_09_nominal_background_simmed_data/IMG_RAD_09_SENS-10000S_Lp_PPS-LM_natural.fits}
  - {instrument: Lp_SPM-LM, det_key: img_lm,
     file_name_abs: data/IMG_RAD_09_nominal_background_simmed_data/IMG_RAD_09_SENS-10000S_Lp_SPM-LM_natural.fits}
  - {instrument: Mp_PPS-CFO2, det_key: img_lm,
     file_name_abs: data/IMG_RAD_09_nominal_background_simmed_data/IMG_RAD_09_SENS-10000S_Mp_PPS-CFO2_natural.fits}
  - {instrument: Mp_PPS-LM, det_key: img_lm,
     file_name_abs: data/IMG_RAD_09_nominal_background_simmed_data/IMG_RAD_09_SENS-10000S_Mp_PPS-LM_natural.fits}
  - {instrument: Mp_SPM-LM, det_key: img_lm,
     file_name_abs: data/IMG_RAD_09_nominal_background_simmed_data/IMG_RAD_09_SENS-10000S_Mp_SPM-LM_natural.fits}
  - {instrument: N2_SPM-N, det_key: img_n,
     file_name_abs: data/IMG_RAD_09_nominal_background_simmed_data/IMG_RAD_09_SENS-10000S_N2_SPM-N_natural.fits}
