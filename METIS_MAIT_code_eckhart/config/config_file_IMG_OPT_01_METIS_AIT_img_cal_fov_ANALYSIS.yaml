# FOV analysis run configurations
# Paths are relative to the project stem (METIS_MAIT_code_eckhart/), or absolute
# Each run inherits defaults; override only what differs
#
# Files as written by IMG_OPT_01_METIS_AIT_img_cal_fov_SIM.py
# (config/config_file_IMG_OPT_01_METIS_AIT_img_cal_fov_SIM.yaml):
# IMG_OPT_01_<requirement>_<instrument>_<case>_dither<N>.fits, with the injected truth
# (REQ_ID, EXPECTED, INJ_VAL, ...) in the primary header. The SIM injects the FoV by
# scaling the dithers, so the guesses differ per case: for a scaling f = FoV_true /
# FoV_injected, the pinhole is 548.5 * f pix (LM) or 441.5 * f pix (N) from the
# detector centre in x and y.

defaults:
  pp_mask: PPS-CFO2
  distances_corner_psfs_arcsec: 6 # arcsec between corner PSFs (2 x the dither offset)
  illuminated_pixels_x: 1920 # pixel length of active on-sky area of detector
  illuminated_pixels_y: 1920
  results_write_dir: results/IMG_OPT_01_fov_analysis_results/

runs:
  # LM, FoV_true = 10.50 arcsec
  - run_label: METIS-1095_pass
    filter_name: Br_alpha
    fp_mask: pinhole_lm
    detector: LM
    dithers:
      - {guess_x: 1575, guess_y: 1574, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_pass_dither0.fits}
      - {guess_x: 478, guess_y: 1574, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_pass_dither1.fits}
      - {guess_x: 478, guess_y: 477, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_pass_dither2.fits}
      - {guess_x: 1575, guess_y: 477, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_pass_dither3.fits}

  - run_label: METIS-1095_fail
    filter_name: Br_alpha
    fp_mask: pinhole_lm
    detector: LM
    dithers:
      - {guess_x: 1527, guess_y: 1526, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_fail_dither0.fits}
      - {guess_x: 526, guess_y: 1526, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_fail_dither1.fits}
      - {guess_x: 526, guess_y: 525, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_fail_dither2.fits}
      - {guess_x: 1527, guess_y: 525, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_fail_dither3.fits}

  - run_label: METIS-1095_fail_low
    filter_name: Br_alpha
    fp_mask: pinhole_lm
    detector: LM
    dithers:
      - {guess_x: 1633, guess_y: 1632, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_fail_low_dither0.fits}
      - {guess_x: 420, guess_y: 1632, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_fail_low_dither1.fits}
      - {guess_x: 420, guess_y: 419, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_fail_low_dither2.fits}
      - {guess_x: 1633, guess_y: 419, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_Br_alpha_fail_low_dither3.fits}

  # N, FoV_true = 13.04 arcsec
  - run_label: METIS-1095_pass
    filter_name: N2
    fp_mask: pinhole_n
    detector: N
    dithers:
      - {guess_x: 1462, guess_y: 1462, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_pass_dither0.fits}
      - {guess_x: 590, guess_y: 1462, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_pass_dither1.fits}
      - {guess_x: 590, guess_y: 590, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_pass_dither2.fits}
      - {guess_x: 1462, guess_y: 590, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_pass_dither3.fits}

  - run_label: METIS-1095_fail
    filter_name: N2
    fp_mask: pinhole_n
    detector: N
    dithers:
      - {guess_x: 1423, guess_y: 1422, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_fail_dither0.fits}
      - {guess_x: 629, guess_y: 1422, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_fail_dither1.fits}
      - {guess_x: 629, guess_y: 629, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_fail_dither2.fits}
      - {guess_x: 1423, guess_y: 629, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_fail_dither3.fits}

  - run_label: METIS-1095_fail_low
    filter_name: N2
    fp_mask: pinhole_n
    detector: N
    dithers:
      - {guess_x: 1506, guess_y: 1505, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_fail_low_dither0.fits}
      - {guess_x: 546, guess_y: 1505, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_fail_low_dither1.fits}
      - {guess_x: 546, guess_y: 546, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_fail_low_dither2.fits}
      - {guess_x: 1506, guess_y: 546, file_name: data/IMG_OPT_01_fov_simmed_data/IMG_OPT_01_METIS-1095_N2_fail_low_dither3.fits}
