# Scenario for IMG_RAD_07_photometric_performance_SIM.py: one entry per requirement.
#
# For each requirement with simulate: true, the SIM writes one FITS file (or one per
# flux level/step) per case and instrument, named
# IMG_RAD_07_<requirement>_<instrument>_<case>[_...].fits,
# with the requirement and the injected truth in the primary header (REQ_ID, REQ_LIM,
# INJ_VAL, EXPECTED, SIMVER, ...).
#
# limit: one or more quantities, each with
#   value:   the requirement's limit
#   pass_if: '<=' (the measured quantity must not exceed the limit) or '>='
#   unit, note: for humans
# cases: case name -> {inject: {quantity: injected value}}. EXPECTED (PASS/FAIL) is
#   computed from inject vs. limit; cases named 'pass' / 'fail' must agree with it (the
#   SIM stops otherwise). Every simulated requirement needs a 'pass' and a 'fail' case,
#   clearly on either side of the limit; other cases (e.g. 'near') are optional.
# (format and options: see modules/sim_common.py)

# WCU / instrument set-ups for the flat fields (WCU FP mask 'open' = flat
# illumination), one per detector; the BB aperture stays at 1.0 and an ND filter keeps
# the full-aperture flat below saturation at the minimum DIT (!DET.mindit). The DIT is
# shortened by the SIM only if the raw flat peaks > 0.8 sat.
instruments:
  Br_alpha: # LM (HAWAII-2RG, fast mode)
    fp_mask: open
    pp_mask: SPM-LM
    psf_kernel: SPM-LM
    obs_filter: Br_alpha
    # without ND, the flat is ~13x full well at mindit; ND_OD2: raw peak ~0.13 sat
    nd_filter: ND_OD2
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  N2: # N (GeoSnap, high-capacity mode)
    fp_mask: open
    pp_mask: SPM-N
    psf_kernel: SPM-N
    obs_filter: N2
    # without ND, the WCU background alone saturates at mindit; ND_OD1: dark ~0.24,
    # raw peak ~0.51 sat
    nd_filter: ND_OD1
    obs_mode: wcu_img_n
    dit: 0.011 # s; mindit of the high-capacity mode
    ndit: 1
    intrapixel_capacitance: true

requirements:

  METIS-2594:
    simulate: true
    description: >-
      METIS internal calibration shall provide a range of flux levels matching that
      encountered in scientific operation as defined in METIS-3137 (E-TNT-MPIA-MET-1004).
    # Flux levels as fractions (0..1) of the headroom between the closed-aperture
    # background B (median of a dark) and the ceiling C: the median raw level at the
    # largest scaling of the flat's signal for which no pixel of the raw readout
    # exceeds 0.8 of saturation (sim_common.MAX_RAW_FRAC x saturation_adu[detector] in
    # config_file_common_observing_params.yaml, ADU per DIT). The raw level (median of
    # the raw frame per DIT, background included) is B + frac * (C - B). The
    # calibration must reach down to 0.1 and up to 0.8 of that headroom.
    limit:
      flux_min:
        value: 0.1
        pass_if: "<=" # the calibration must reach down to the faintest level
        unit: fraction of (ceiling - background)
        note: faintest calibration flux, as a fraction of the headroom above background
      flux_max:
        value: 0.8
        pass_if: ">=" # ... and up to the brightest
        unit: fraction of (ceiling - background)
        note: brightest calibration flux, as a fraction of the headroom above background
    cases:
      pass: {inject: {flux_min: 0.05, flux_max: 0.9}}
      fail: {inject: {flux_min: 0.05, flux_max: 0.5}} # does not reach high enough
      fail_low: {inject: {flux_min: 0.2, flux_max: 0.9}} # does not reach low enough

  METIS-2883:
    simulate: true
    description: >-
      The source used for detector linearity calibration METIS-3289 shall provide an
      illumination that is spatially homogeneous within +/- 3% peak-to-valley over the
      science field of view of METIS.
    limit:
      half_ptv:
        value: 0.03
        pass_if: "<="
        unit: fraction
        note: "+/-3% PtV, read as max |pixel / mean - 1| of the flat over the FOV"
    cases:
      pass: {inject: {half_ptv: 0.01}}
      near: {inject: {half_ptv: 0.025}}
      fail: {inject: {half_ptv: 0.06}}

  METIS-3300:
    simulate: true
    description: >-
      The level of flux of the flat field shall be tunable to 15 discrete values and
      shall be known at each step to 0.3%. The resulting spatial illumination pattern
      shall remain constant across the field within 0.5% (0.3% as goal) after tuning.
    # Flux steps: the BB aperture is fixed; the exposure E = T_ND x DIT is stepped
    # linearly, E_k = E_max * k / n_steps, with E_max putting the raw peak at
    # 0.8 sat / (1 + peak_margin). Per step, the least attenuating ND of nd_filters
    # with DIT = E_k / T_ND >= mindit is used (any ND is safe for saturation, as the
    # raw peak scales with E; LM ends up on OD2/OD3, N on OD1/OD2). peak_margin covers
    # the injected flux error and pattern change (fail case: 1.01 x 1.01) and the
    # detector dark current, which the ND does not attenuate (N: ~500 ADU/s).
    n_steps: 15
    bb_aperture: 1.0
    nd_filters: [ND_OD1, ND_OD2, ND_OD3, ND_OD4] # in both the LM and N ND wheels
    peak_margin: 0.03
    limit:
      flux_error:
        value: 0.003
        pass_if: "<="
        unit: fraction
        note: max |flux / nominal flux - 1| over the steps
      pattern_change:
        value: 0.005
        pass_if: "<="
        unit: fraction
        note: >-
          max |normalised flat of a step / step-averaged normalised flat - 1|
          (goal 0.003)
    cases:
      pass: {inject: {flux_error: 0.001, pattern_change: 0.001}}
      fail: {inject: {flux_error: 0.01, pattern_change: 0.01}}

  # not simulated (yet)
  METIS-2595:
    simulate: false
    description: Relative photometric accuracy shall be better than 0.97% rms.
    reason: verified by test at Observatory level
  METIS-2595-colour:
    simulate: false
    description: Uncertainty in color correction should be less than 1% rms.
    reason: >-
      verified by test at Observatory level (the test description lists this as
      METIS-2595 too; check the requirement ID)
  METIS-3291:
    simulate: false
    description: >-
      METIS shall allow the characterisation and correction of the relative spectral
      response function (RSRF) with 3% precision over the wavelength range specified
      in METIS-1090.
    reason: needs a spectrally resolved WCU source model; TBD
  METIS-3301:
    simulate: false
    description: >-
      After calibration, the distortions introduced by METIS shall be removed to better
      than 0.5 mas over the full field of view.
    reason: distortion; simulated for IMG-OPT-02
