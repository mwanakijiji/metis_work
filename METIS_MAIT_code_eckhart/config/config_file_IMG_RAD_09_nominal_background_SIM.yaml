# Scenario for IMG_RAD_09_nominal_background_behavior_SIM.py: one entry per requirement.
# Format and options: see modules/sim_common.py and
# config_file_IMG_RAD_07_phot_performance_SIM.yaml.
# Files: data/IMG_RAD_09_nominal_background_simmed_data/
#   IMG_RAD_09_<requirement>_<instrument>_<case>.fits

# WCU flat-field set-ups (as for IMG-RAD-07; WCU FP mask 'open' = flat illumination by
# the 1000 K black body, BB aperture fully open), one per detector, standing in for a
# uniform background: every readout is background (WCU + instrument), no source.
# - pp_mask / psf_kernel: the cold-stop pupil mask and its PSF kernel
# - nd_filter: keeps the full-aperture flat below saturation at the minimum DIT
# - dit: starting value (the detector's minimum DIT); run_scenario shortens it if the
#   raw flat peaks > 0.8 of saturation. NDIT is set by the SIM from total_exptime_s.
instruments:
  Lp: # LM (HAWAII-2RG, fast mode)
    fp_mask: open
    pp_mask: SPM-LM
    psf_kernel: SPM-LM
    obs_filter: Lp
    # Br_alpha needs ND_OD2 for a raw peak of ~0.13 sat; L' is much broader
    nd_filter: ND_OD3
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  N2: # N (GeoSnap, high-capacity mode)
    fp_mask: open
    pp_mask: SPM-N
    psf_kernel: SPM-N
    obs_filter: N2
    # without ND, the WCU background alone saturates at mindit; ND_OD1: dark ~0.24,
    # raw peak ~0.51 sat (IMG-RAD-07)
    nd_filter: ND_OD1
    obs_mode: wcu_img_n
    dit: 0.011 # s; mindit of the high-capacity mode
    ndit: 1
    intrapixel_capacitance: true

requirements:

  SENS-10000S:
    simulate: true
    req_id: IMG-RAD-09 sensitivity (ID TBD)
    description: >-
      Verify sensititity requirement on point source in a 10000 second exposure.
    limit_is_placeholder: true
    # integration: total_exptime_s per frame (raw frame and background frame each),
    # as n_exposures readouts of NDIT x DIT (DIT as tuned by run_scenario), averaged
    # (ScopeSim integrates NDIT x DIT in one readout, so 1 is enough; more splits the
    # integration, e.g. into nod cycles)
    total_exptime_s: 10000
    n_exposures: 1
    # 1-sigma point-source noise (aperture sums, backbone_img_rad_09_nom) of the
    # background-subtracted 10000 s frame, in absolute flux units (PLACEHOLDER: ADU/s
    # until the counts-to-flux calibration in
    # config_file_IMG_RAD_09_nominal_background_observing.yaml is known). The SIM
    # scales the noise of (raw - background) to the injected level.
    # Placeholder values were set around the natural noise of the first (on-sky) SIM
    # run (with the placeholder calibration 1.0: L' 9.7, N2 10.3 ADU/s). With the WCU
    # flat (2026-11-12 run) the natural noise is L' 18.4, N2 12.4 ADU/s, so the cases
    # scale it by 0.44 / 0.87 (L') and 0.64 / 1.29 (N2); TO BE REVISED (the SIM warns
    # if a case scales it by < 0.5 or > 2). Per-detector values can go in by_detector
    # (the ANALYSIS limit in the observing config must match REQ_LIM).
    limit:
      noise_flux:
        value: 12.0 # PLACEHOLDER
        pass_if: "<="
        unit: flux (PLACEHOLDER)
        note: 1-sigma point-source noise in a 10000 s exposure
    cases:
      pass: {inject: {noise_flux: 8.0}}
      fail: {inject: {noise_flux: 16.0}}
