# Scenario for IMG_RAD_09_nominal_background_behavior_SIM.py: one entry per requirement.
# Format and options: see modules/sim_common.py and
# config_file_IMG_RAD_07_phot_performance_SIM.yaml.
# Files: data/IMG_RAD_09_nominal_background_simmed_data/
#   IMG_RAD_09_<requirement>_<instrument>_<case>.fits

# WCU pinhole set-ups, standing in for a point source (FP mask pinhole_lm / pinhole_n,
# BB aperture fully open), one per band and pupil-plane mask: Lp and Mp on the LM
# detector, N2 on the N detector, each with every pupil mask that has its own ScopeSim
# PSF kernel (PPS-CFO2, PPS-LM: <mask>_WCU kernels without the ELT spiders; SPM-LM,
# SPM-N). The set-up key is the file tag: IMG_RAD_09_SENS-10000S_<band>_<mask>_<case>.
# - nd_filter: keeps the raw peak below saturation at the minimum DIT, for the
#   brightest pupil mask of the band (PPS-LM transmits ~1.2x PPS-CFO2); with the
#   pinhole and PPS-CFO2 at mindit: Lp ND_OD1 saturates, ND_OD2 0.11 sat; Mp ND_OD1
#   0.72, ND_OD2 0.07 sat; N2 without ND the background alone saturates, ND_OD1 0.26
# - dit: starting value (the detector's minimum DIT); run_scenario shortens it if the
#   raw frame peaks > 0.8 of saturation. NDIT is set by the SIM from total_exptime_s.
instruments:
  Lp_PPS-CFO2: # LM (HAWAII-2RG, fast mode)
    fp_mask: pinhole_lm
    pp_mask: PPS-CFO2
    psf_kernel: null # -> PPS-CFO2_WCU
    obs_filter: Lp
    nd_filter: ND_OD2
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  Lp_PPS-LM: # LM (HAWAII-2RG, fast mode)
    fp_mask: pinhole_lm
    pp_mask: PPS-LM
    psf_kernel: null # -> PPS-LM_WCU
    obs_filter: Lp
    nd_filter: ND_OD2
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  Lp_SPM-LM: # LM (HAWAII-2RG, fast mode)
    fp_mask: pinhole_lm
    pp_mask: SPM-LM
    psf_kernel: SPM-LM
    obs_filter: Lp
    nd_filter: ND_OD2
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  Mp_PPS-CFO2: # LM (HAWAII-2RG, fast mode)
    fp_mask: pinhole_lm
    pp_mask: PPS-CFO2
    psf_kernel: null # -> PPS-CFO2_WCU
    obs_filter: Mp
    nd_filter: ND_OD2
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  Mp_PPS-LM: # LM (HAWAII-2RG, fast mode)
    fp_mask: pinhole_lm
    pp_mask: PPS-LM
    psf_kernel: null # -> PPS-LM_WCU
    obs_filter: Mp
    nd_filter: ND_OD2
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  Mp_SPM-LM: # LM (HAWAII-2RG, fast mode)
    fp_mask: pinhole_lm
    pp_mask: SPM-LM
    psf_kernel: SPM-LM
    obs_filter: Mp
    nd_filter: ND_OD2
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  N2_SPM-N: # N (GeoSnap, high-capacity mode)
    fp_mask: pinhole_n
    pp_mask: SPM-N
    psf_kernel: SPM-N
    obs_filter: N2
    nd_filter: ND_OD1
    obs_mode: wcu_img_n
    dit: 0.011 # s; mindit of the high-capacity mode
    ndit: 1
    intrapixel_capacitance: true

requirements:

  SENS-10000S:
    simulate: true
    req_id: IMG-RAD-09 sensitivity (ID TBD)
    description: >-
      Verify sensititity requirement on point source in a 10000 second exposure.
    limit_is_placeholder: true
    # integration: total_exptime_s per readout (the pinhole readout; the dark written
    # as BACKGROUND for the file layout is as long), as n_exposures readouts of
    # NDIT x DIT (DIT as tuned by run_scenario), averaged (ScopeSim integrates
    # NDIT x DIT in one readout, so 1 is enough)
    total_exptime_s: 10000
    n_exposures: 1
    # 1-sigma point-source noise (aperture sums away from the PSF,
    # backbone_img_rad_09_nom) of the 10000 s pinhole readout itself (RAW_READOUT,
    # nothing subtracted), in absolute flux units (PLACEHOLDER: ADU/s until the
    # counts-to-flux calibration in
    # config_file_IMG_RAD_09_nominal_background_observing.yaml is known). Nothing is
    # injected: one natural readout per set-up (no cases), the ANALYSIS reports the
    # measured noise against the limit. The limit is a PLACEHOLDER (it must match the
    # ANALYSIS limit in the observing config).
    limit:
      noise_flux:
        value: 12.0 # PLACEHOLDER
        pass_if: "<="
        unit: flux (PLACEHOLDER)
        note: 1-sigma point-source noise in a 10000 s exposure
