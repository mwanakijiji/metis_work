# Strehl analysis run configurations
# Paths are relative to the project stem (METIS_MAIT_code_eckhart/), or absolute
# Each run inherits defaults; override only what differs
#
# Files as written by IMG_OPT_03_METIS_AIT_img_cal_psf_quality_SIM.py
# (config/config_file_IMG_OPT_03_SIM.yaml): IMG_OPT_03_<requirement>_<instrument>_<case>.fits,
# with the injected truth (REQ_ID, EXPECTED, INJ_VAL, ...) in the primary header.
# N.b. with psfs_subset < the number of PSFs in a grid, a Strehl verdict can only be
# FAIL or INCONCLUSIVE (not the entire FOV); set psfs_subset: 'all' for PASS on grid_lm.
# (Earlier SIM files were named
# IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_<fp_mask>_pupil_mask_<pp_mask>_filter_<filter>.fits)

defaults:
  fp_mask: grid_lm
  pp_mask: PPS-LM
  fit_simmed_psf: false
  fit_annular_aperture_free: true
  fit_annular_aperture_fixed: true
  # psfs_subset: 'all' to process all PSFs, or an integer to process only the first N PSFs
  psfs_subset: 1
  # fit_method: 'curve_fit' (default) or 'amoeba' for annular aperture free-parameter fit
  fit_method: curve_fit
  config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses.yaml
  results_write_dir: results/IMG_OPT_03_psf_quality_analysis_results/

runs:
  # METIS-1408/-1409, LM (grid_lm; coord guesses from the defaults)
  - filter_name: HCI_L_short
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_METIS-1408-1409_HCI_L_short_SPM-LM_pass.fits
    pp_mask: SPM-LM

  - filter_name: HCI_L_short
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_METIS-1408-1409_HCI_L_short_SPM-LM_near.fits
    pp_mask: SPM-LM

  - filter_name: HCI_L_short
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_METIS-1408-1409_HCI_L_short_SPM-LM_fail.fits
    pp_mask: SPM-LM

  # METIS-1408/-1409, N (single pinhole_n PSF near the detector centre)
  - filter_name: N2
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_METIS-1408-1409_N2_CLS-N_pass.fits
    fp_mask: pinhole_n
    pp_mask: CLS-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  - filter_name: N2
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_METIS-1408-1409_N2_CLS-N_near.fits
    fp_mask: pinhole_n
    pp_mask: CLS-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  - filter_name: N2
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_METIS-1408-1409_N2_CLS-N_fail.fits
    fp_mask: pinhole_n
    pp_mask: CLS-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  # METIS-2864 (3.3 um, LM)
  - filter_name: PAH_3.3
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_METIS-2864_PAH_3.3_PPS-CFO2_pass.fits
    pp_mask: PPS-CFO2

  - filter_name: PAH_3.3
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_METIS-2864_PAH_3.3_PPS-CFO2_fail.fits
    pp_mask: PPS-CFO2
