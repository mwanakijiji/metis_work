# Strehl analysis run configurations
# Paths are absolute (podman-share layout); filenames match data/IMG_OPT_03_psf_quality_simmed_data/
# Each run inherits defaults; override only what differs

defaults:
  fp_mask: grid_lm
  pp_mask: PPS-LM
  fit_simmed_psf: false
  fit_annular_aperture_free: true
  fit_annular_aperture_fixed: true
  # psfs_subset: 'all' to process all PSFs, or an integer to process only the first N PSFs
  psfs_subset: 1
  # fit_method: 'curve_fit' (default) or 'amoeba' for annular aperture free-parameter fit
  fit_method: curve_fit
  config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses.yaml
  results_write_dir: results/IMG_OPT_03_psf_quality_analysis_results/

runs:
  # (filter, cold stop) rows of E-REP-MPIA-1203 0-1, Table 4-1, as written by the current
  # IMG_OPT_03_METIS_AIT_img_cal_psf_quality_SIM.py (lm_obs_configs + n_obs_configs)

  # LM (grid_lm; coord guesses from the defaults)
  - filter_name: HCI_L_short
    file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_SPM-LM_filter_HCI_L_short.fits
    pp_mask: SPM-LM

  - filter_name: HCI_L_short
    file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_PPS-LM_filter_HCI_L_short.fits
    pp_mask: PPS-LM

  - filter_name: HCI_L_short
    file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_RLS-LM_filter_HCI_L_short.fits
    pp_mask: RLS-LM

  - filter_name: Lp
    file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_PPS-CFO2_filter_Lp.fits
    pp_mask: PPS-CFO2

  - filter_name: IB_4.05
    file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_CLS-LM_filter_IB_4.05.fits
    pp_mask: CLS-LM

  - filter_name: Mp
    file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_CLS-LM_filter_Mp.fits
    pp_mask: CLS-LM

  - filter_name: CO_ref
    file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_grid_lm_pupil_mask_CLS-LM_filter_CO_ref.fits
    pp_mask: CLS-LM

  # N (single pinhole_n PSF near the detector centre)
  - filter_name: N1
    file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_pinhole_n_pupil_mask_SPM-N_filter_N1.fits
