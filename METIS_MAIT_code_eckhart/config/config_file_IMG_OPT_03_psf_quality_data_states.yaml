    pp_mask: SPM-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  - filter_name: N2
    file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_wcu_focal_mask_bckgrnd_subted_pinhole_n_pupil_mask_CLS-N_filter_N2.fits
    fp_mask: pinhole_n
    pp_mask: CLS-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  - filter_name: N3
