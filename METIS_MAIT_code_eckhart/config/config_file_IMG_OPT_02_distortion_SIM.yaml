# Scenario for IMG_OPT_02_METIS_AIT_img_cal_distortion_SIM.py: one entry per requirement.
# Format and options: see modules/sim_common.py and
# config_file_IMG_RAD_07_phot_performance_SIM.yaml.
# Files: data/IMG_OPT_02_distortion_simmed_data/
#   IMG_OPT_02_GRID-FRAMES_<instrument>_reference.fits
#   (read by the ANALYSIS via config_file_IMG_02_strehl_runs.yaml)
#
# !!! TBD: more distortion info from the DD is needed before distortions can be
# injected, so no requirement cases are simulated yet: GRID-FRAMES writes one
# unmodified pinhole-grid frame per instrument set-up (sim_common.write_reference_frame).

# WCU set-ups: the pinhole grid (grid_lm) through PPS-CFO2, one per LM filter. dit is a
# starting value: run_scenario shortens it if needed so the raw readout (BB aperture
# fully open) peaks at <= 0.8 of saturation (DIT, DIT_CFG and PEAKFRAC in the header).
# Available LM filters: open, Lp, short-L, L_spec, Mp, M_spec, Br_alpha, Br_alpha_ref,
# PAH_3.3, PAH_3.3_ref, CO_1-0_ice, CO_ref, H2O-ice, IB_4.05, HCI_L_short, HCI_L_long,
# HCI_M
grid_lm: &grid_lm
  fp_mask: grid_lm
  pp_mask: PPS-CFO2
  obs_mode: wcu_img_lm
  intrapixel_capacitance: true

instruments:
  Br_alpha: {<<: *grid_lm, obs_filter: Br_alpha, nd_filter: null, dit: 0.065, ndit: 2}
  Br_alpha_ref:
    {<<: *grid_lm, obs_filter: Br_alpha_ref, nd_filter: ND_OD1, dit: 0.4, ndit: 5}
  Lp: {<<: *grid_lm, obs_filter: Lp, nd_filter: ND_OD2, dit: 0.375, ndit: 3}
  H2O-ice: {<<: *grid_lm, obs_filter: H2O-ice, nd_filter: ND_OD1, dit: 0.06, ndit: 1}
  short-L: {<<: *grid_lm, obs_filter: short-L, nd_filter: ND_OD2, dit: 0.375, ndit: 4}
  PAH_3.3: {<<: *grid_lm, obs_filter: PAH_3.3, nd_filter: ND_OD1, dit: 0.1875, ndit: 7}
  PAH_3.3_ref:
    {<<: *grid_lm, obs_filter: PAH_3.3_ref, nd_filter: ND_OD1, dit: 0.1875, ndit: 8}
  IB_4.05:
    {<<: *grid_lm, obs_filter: IB_4.05, nd_filter: ND_OD1, dit: 0.16666667, ndit: 12}
  HCI_L_short:
    {<<: *grid_lm, obs_filter: HCI_L_short, nd_filter: ND_OD2, dit: 0.83333333, ndit: 3}
  HCI_L_long:
    {<<: *grid_lm, obs_filter: HCI_L_long, nd_filter: ND_OD1, dit: 0.06, ndit: 25}
  Mp: {<<: *grid_lm, obs_filter: Mp, nd_filter: ND_OD2, dit: 0.5, ndit: 5}
  CO_1-0_ice:
    {<<: *grid_lm, obs_filter: CO_1-0_ice, nd_filter: ND_OD1, dit: 0.0952381, ndit: 21}
  CO_ref: {<<: *grid_lm, obs_filter: CO_ref, nd_filter: ND_OD1, dit: 0.0952381, ndit: 21}
  HCI_M: {<<: *grid_lm, obs_filter: HCI_M, nd_filter: ND_OD1, dit: 0.09090909, ndit: 22}
  L_spec: {<<: *grid_lm, obs_filter: L_spec, nd_filter: ND_OD2, dit: 0.12, ndit: 11}
  M_spec: {<<: *grid_lm, obs_filter: M_spec, nd_filter: ND_OD2, dit: 0.28571429, ndit: 7}

requirements:

  # not a requirement: the unmodified pinhole-grid frames the ANALYSIS runs on
  GRID-FRAMES:
    simulate: true
    description: unmodified pinhole-grid frames, one per LM filter (no injection)

  METIS-1097:
    simulate: false
    req_id: METIS-1097
    description: >-
      The Imager shall provide a pixel scale of 5.47 +0.26/-0.26 mas/pix for the
      LM-band and 6.79 +0.25/-0.50 mas/pix for the N-band.
    reason: distortion info from the DD TBD

  METIS-3502:
    simulate: false
    req_id: METIS-3502
    description: >-
      After calibration, the distortions introduced by METIS shall be removed to better
      than 0.5 mas (ca. 1/10 px for the L band imager) over the full field of view.
    reason: distortion info from the DD TBD

  METIS-8222:
    simulate: false
    req_id: METIS-8222
    description: >-
      The center of the H2RG chip within IMG-LM-DET shall be offset from the METIS
      optical axis by 175 mas +/- 25 mas on-sky PtV in the "across H2RG stripe"
      direction (i.e., perpendicularly to the orientation of the 32 stripes in the H2RG
      detector).
    reason: distortion info from the DD TBD

  METIS-9920:
    simulate: false
    req_id: METIS-9920
    description: >-
      Image scale and distortion of METIS shall be constant (for each optical
      configuration, even after change of observing modes) to an accuracy of 1e-3
      (goal: 1e-4) at L/M-band and 2e-3 (goal: 2e-4) at N-band with respect to the full
      field of view.
    reason: distortion info from the DD TBD
