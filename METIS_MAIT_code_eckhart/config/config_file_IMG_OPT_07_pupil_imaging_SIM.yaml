    pp_mask: null # TBD: pupil-plane mask for pupil imaging
    obs_filter: HCI_L_short # placeholder
    nd_filter: null
    obs_mode: wcu_img_lm
    dit: 0.04 # s; placeholder (mindit of the fast mode)
    ndit: 1
    intrapixel_capacitance: true
  N: # N (GeoSnap, high-capacity mode)
    fp_mask: null # TBD
    pp_mask: null # TBD
    obs_filter: N2 # placeholder
    nd_filter: null
    obs_mode: wcu_img_n
    dit: 0.011 # s; placeholder (mindit of the high-capacity mode)
    ndit: 1
    intrapixel_capacitance: true

requirements:

