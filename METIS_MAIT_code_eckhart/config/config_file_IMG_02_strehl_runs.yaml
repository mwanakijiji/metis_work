# Strehl analysis run configurations
# Paths are relative to the project stem (METIS_MAIT_code_eckhart/), or absolute
# Each run inherits defaults; override only what differs

defaults:
  fp_mask: grid_lm
  pp_mask: PPS-CFO2
  fit_simmed_psf: false
  fit_annular_aperture_free: true
  fit_annular_aperture_fixed: true
  # psfs_subset: 'all' to process all PSFs, or an integer to process only the first N PSFs
  psfs_subset: 1
  # fit_method: 'curve_fit' (default) or 'amoeba' for annular aperture free-parameter fit
  fit_method: curve_fit
  config_coords_guesses_file_name: config/config_file_IMG_02_coords_ver11.yaml
  results_write_dir: results/IMG_OPT_02_distortion_analysis_results/

runs:
  - filter_name: Br_alpha
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_Br_alpha_reference.fits
    pp_mask: PPS-CFO2
    fit_method: curve_fit
    fit_annular_aperture_fixed: true
    fit_annular_aperture_free: true

  - filter_name: Br_alpha
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_Br_alpha_reference.fits
    pp_mask: PPS-CFO2

  - filter_name: Br_alpha_ref
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_Br_alpha_ref_reference.fits

  - filter_name: Lp
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_Lp_reference.fits

  - filter_name: H2O-ice
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_H2O-ice_reference.fits

  - filter_name: PAH_3.3
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_PAH_3.3_reference.fits

  - filter_name: PAH_3.3_ref
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_PAH_3.3_ref_reference.fits

  - filter_name: short-L
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_short-L_reference.fits

  - filter_name: IB_4.05
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_IB_4.05_reference.fits

  - filter_name: HCI_L_short
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_HCI_L_short_reference.fits

  - filter_name: HCI_L_long
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_HCI_L_long_reference.fits

  - filter_name: Mp
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_Mp_reference.fits

  - filter_name: CO_1-0_ice
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_CO_1-0_ice_reference.fits

  - filter_name: CO_ref
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_CO_ref_reference.fits

  - filter_name: HCI_M
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_HCI_M_reference.fits

  - filter_name: L_spec
    file_name: data/IMG_OPT_02_distortion_simmed_data/IMG_OPT_02_GRID-FRAMES_L_spec_reference.fits

  - filter_name: M_spec
