# central weighted wavelength only; can lead to inaccuracies
monochromatic_observing_filters_lm:
  short-L: 3.29e-6
  Lp: 3.82e-6
  L_spec: 3.56e-6
  Mp: 4.76e-6
  M_spec: 4.87e-6
  Br_alpha: 4.06e-6
  Br_alpha_ref: 3.93e-6
  PAH_3.3: 3.31e-6
  PAH_3.3_ref: 3.45e-6
  CO_1-0_ice: 4.66e-6
  CO_ref: 4.94e-6
  H2O-ice: 3.09e-6
  IB_4.05: 4.04e-6
  HCI_L_short: 3.62e-6
  HCI_L_long: 3.80e-6
  HCI_M: 4.95e-6

# file names of actual filter curves
# paths are pre-pended in the code with 
# PKGS_DIR = (Path(__file__).resolve().parent / "inst_pkgs").resolve()
polychromatic_observing_filters_lm_leaf_name:
  short-L: '/METIS/filters/TC_filter_short-L.dat'
  Lp: '/METIS/filters/TC_filter_Lp.dat'
  L_spec: '/METIS/filters/TC_filter_L_spec.dat'
  Mp: '/METIS/filters/TC_filter_Mp.dat'
  M_spec: '/METIS/filters/TC_filter_M_spec.dat'
  Br_alpha: '/METIS/filters/TC_filter_Br_alpha.dat'
  Br_alpha_ref: '/METIS/filters/TC_filter_Br_alpha_ref.dat'
  PAH_3.3: '/METIS/filters/TC_filter_PAH_3.3.dat'
  PAH_3.3_ref: '/METIS/filters/TC_filter_PAH_3.3_ref.dat'
  CO_1-0_ice: '/METIS/filters/TC_filter_CO_1-0_ice.dat'
  CO_ref: '/METIS/filters/TC_filter_CO_ref.dat'
  H2O-ice: '/METIS/filters/TC_filter_H2O-ice.dat'
  IB_4.05: '/METIS/filters/TC_filter_IB_4.05.dat'
  HCI_L_short: '/METIS/filters/TC_filter_HCI_L_short.dat'
  HCI_L_long: '/METIS/filters/TC_filter_HCI_L_long.dat'
  HCI_M: '/METIS/filters/TC_filter_HCI_M.dat'

# N-band equivalents of the two blocks above; central wavelengths are
# transmission-weighted means of the TC_filter_*.dat curves (same as in the IMG-OPT-03 config)
monochromatic_observing_filters_n:
  N1: 8.648e-6
  N2: 11.201e-6
  N3: 12.261e-6
  PAH_8.6: 8.614e-6
  S_IV: 10.549e-6
  Ne_II: 12.739e-6

polychromatic_observing_filters_n_leaf_name:
  N1: '/METIS/filters/TC_filter_N1.dat'
  N2: '/METIS/filters/TC_filter_N2.dat'
  N3: '/METIS/filters/TC_filter_N3.dat'
  PAH_8.6: '/METIS/filters/TC_filter_PAH_8.6.dat'
  S_IV: '/METIS/filters/TC_filter_S_IV.dat'
  Ne_II: '/METIS/filters/TC_filter_Ne_II.dat'


# units are mas/pixel
pixel_scales:
  img_lm: 5.47
  img_n: 6.79

mode_sensitivity_point:
  lprime: 0.587e-6
  n2: 1.285e-4
# units Jy
# Ref.: Table 3.1 in 'Ghost Light Analysis in Direct
# Imaging Modes E-REP-NOVA-MET-1338'

mode_sensitivity_extended:
  lprime: 1.230e-3
  n2: 2.915e-2
# units Jy/arcsec**2
# Ref.: Table 3.1 in 'Ghost Light Analysis in Direct
# Imaging Modes E-REP-NOVA-MET-1338'

# which of the sensitivity bands above to use for each detector (pixel_scales keys);
# n.b. the L'/N2 values are applied to all filters on that detector
sensitivity_band:
  img_lm: lprime
  img_n: n2

# Jy -> counts conversion: counts in the analysed readout per Jy of source flux
# (i.e., for the DIT/NDIT of the simulated frames). Extended-source limits are first
# converted from Jy/arcsec**2 to Jy/pixel with the pixel solid angle,
# (pixel_scales / 1000)**2 arcsec**2
# PLACEHOLDER VALUES: replace with the real photometric zero points
jy_to_counts_is_placeholder: true
jy_to_counts:
  img_lm: 1.0e8
  img_n: 1.0e6

D_aperture:
  full: 34.6878
  D_obscuration: 12.8502

# ELT EXIT PUPIL GEOMETRY
# Ref. p. 8 in E-REP-ULG-MET-1033 1-0 01/08/2022:
#  full: 36.876
#  D_obscuration: 10.053
# based on numbers from RvB, 2 Mar 2026:
#  full: 34.6878
#  D_obscuration: 12.8502
# corresponding to PPS-CFO2 mask:

# mapping: analysis detector labels → pixel_scales keys
scope_sim_to_analysis:
  LM: img_lm
  N: img_n
