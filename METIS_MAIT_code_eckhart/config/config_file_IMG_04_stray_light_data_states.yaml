# Optional per data state:
#   segmentation_method: combined (default), or a single method: threshold, hough_circle,
#     active_contour, watershed, kmeans, meanshift
#   segmentation_params: dict overriding the defaults in
#     stray_light_common.SEGMENTATION_DEFAULT_PARAMS[<method>], e.g.
#       segmentation_method: watershed
#       segmentation_params: {threshold_kind: otsu, min_distance: 15}
#     for 'combined', nest them per method, e.g.
#       segmentation_params: {watershed: {min_distance: 15}, kmeans: {k: 4}}
#   For 'combined' only:
#     segmentation_weights: weight in [0,1] per method; omitted methods default to 1, 0 disables a method
#     segmentation_vote_fraction: N in [0,1] (default 0.5); a pixel is stray light if the summed
#       weight of the methods detecting it > N * (sum of all weights)
#
# Files as written by IMG_OPT_04_METIS_AIT_img_cal_stray_light_SIM.py
# (config/config_file_IMG_04_SIM.yaml): IMG_OPT_04_<requirement>_<instrument>_<case>.fits,
# with the injected truth (REQ_ID, EXPECTED, INJ_VAL, ...) in the primary header
data_states:

