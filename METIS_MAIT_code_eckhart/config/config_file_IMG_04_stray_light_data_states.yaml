#   segmentation_params: dict overriding the defaults in
#     backbone_img_04_stray_light.SEGMENTATION_DEFAULT_PARAMS[<method>], e.g.
#       segmentation_method: watershed
#       segmentation_params: {threshold_kind: otsu, min_distance: 15}
data_states:
  - file_name: data/IMG_04_simmed_stray_light_data/IMG_OPT_04_stray_light_pinhole_lm_pupil_mask_PPS-CFO2_filter_Br_alpha.fits
