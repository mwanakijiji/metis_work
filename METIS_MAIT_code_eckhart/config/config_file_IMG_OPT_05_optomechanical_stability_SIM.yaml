# Scenario for IMG_OPT_05_optomechanical_stability_SIM.py: one entry per requirement.
# Format and options: see modules/sim_common.py and
# config_file_IMG_RAD_07_phot_performance_SIM.yaml.
# Files: data/IMG_OPT_05_optomechanical_stability_simmed_data/
#   <timescale>s_<instrument>/IMG_OPT_05_METIS-5422_<instrument>_<case>_<timescale>s_frameNN.fits
#
# METIS-5422 is tested with pupil imaging, which ScopeSim can't do (and the CFO-FP2
# mask isn't in ScopeSim yet): ScopeSim supplies the readouts (background, noise) and
# the SIM adds a sharp circular pupil image to them. METIS-1230 is still a stub.

instruments:
  Lp: # L band, LM detector (HAWAII-2RG, fast mode)
    # ScopeSim only supplies the dark readouts (WCU background + detector noise) that
    # the pupil image is added to; the masks don't shape the pupil image. The ND filter
    # only affects the open-aperture frame (DIT check against saturation, header);
    # the pupil image's level is set by pupil.level_frac_sat below.
    fp_mask: open
    pp_mask: SPM-LM
    psf_kernel: SPM-LM
    obs_filter: Lp
    nd_filter: ND_OD3
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  Mp: # M band, LM detector (HAWAII-2RG, fast mode); as Lp
    fp_mask: open
    pp_mask: SPM-LM
    psf_kernel: SPM-LM
    obs_filter: Mp
    nd_filter: ND_OD3
    obs_mode: wcu_img_lm
    dit: 0.04 # s; mindit of the fast mode
    ndit: 1
    intrapixel_capacitance: true
  N2: # N band, N detector (GeoSnap, high-capacity mode); as Lp
    fp_mask: open
    pp_mask: SPM-N
    psf_kernel: SPM-N
    obs_filter: N2
    # without ND, the WCU background alone saturates at mindit (cf. IMG-RAD-07 N2)
    nd_filter: ND_OD1
    obs_mode: wcu_img_n
    dit: 0.011 # s; mindit of the high-capacity mode
    ndit: 1
    intrapixel_capacitance: true

requirements:

  METIS-1230:
    simulate: false
    req_id: METIS-1230
    verification: by test at System level
    description: >-
      METIS shall require an on-sky flux calibration not more often than once per hour
      per instrument mode, so long as the instrument is not powered down or disturbed in
      a manner outside its nominal operations concept during this period.
    # for reference (no limit/cases until a simulation is implemented)
    calibration_interval_min_h: 1
    reason: stub; simulation of the flux-calibration stability TBD

  METIS-5422:
    simulate: true
    instruments: [Lp, Mp, N2]
    req_id: METIS-5422
    verification: by test at System level, applicable to IMG
    description: >-
      The position of the Vortex Phase Mask (VPM) located in CFO-FP2 shall be stable
      with respect to the IMG detectors, with the following accuracy: On timescales
      between 10 sec and 10 min (goal: up to 1h): - 0.2 mas RMS on sky for the L- and
      M-band VPMs with respect to the IMG-LM detector - 0.5 mas RMS on sky for the
      N-band VPMs with respect to the IMG-N detector. On timescales below 10 sec: - 1
      mas RMS on sky for the L- and M-band VPMs with respect to the IMG-LM detector -
      2.5 mas RMS on sky for the N-band VPMs with respect to the IMG-N detector.
    # Pupil image (sharp uniform disk) added to independent ScopeSim dark readouts,
    # jittered from frame to frame: for each timescale, case and instrument, a sequence
    # of n_frames frames spread evenly over the timescale (timestamps in DATE-OBS /
    # T_REL), with independent random offsets scaled so that their 2D RMS about the
    # mean position is exactly the injected position_rms (mas on sky; detector pixels
    # x the pixel scale of the instrument's detector: IMG-LM 5.47, IMG-N 6.79 mas/px,
    # pixel_scales in the common observing config), so the same RMS in mas is a
    # smaller shift in pixels on the N detector.
    # Timescales tested [s]. Full set: [10, 30, 60, 300, 600, 1800, 3600]; each
    # timescale writes n_frames x n_cases full frames (~50 MB each).
    timescales_s: [10, 3600]
    # timescales above this are the goal (10 s - 10 min limits up to 1 h): LIMTYPE
    requirement_max_s: 600
    n_frames: 10
    pupil:
      diameter_px: 1000
      level_frac_sat: 0.5 # raw level inside the pupil, as a fraction of saturation
      centre_px: null # [x, y]; null = frame centre
      seed: 5422
    limit:
      position_rms:
        value: 0.2
        pass_if: "<="
        unit: mas
        note: >-
          2D RMS of the pupil-image position about its mean over a sequence, on sky
          (10 s - 10 min; goal up to 1 h). Below 10 s: 1 mas (LM), 2.5 mas (N)
    by_detector:
      img_n:
        limit:
          position_rms:
            value: 0.5
            pass_if: "<="
            unit: mas
            note: 2D RMS on sky, IMG-N (10 s - 10 min; goal up to 1 h)
        cases: # on either side of the IMG-N limit (0.5 mas)
          pass: {inject: {position_rms: 0.25}}
          fail: {inject: {position_rms: 1.0}}
    cases: # on either side of the IMG-LM limit (0.2 mas)
      pass: {inject: {position_rms: 0.1}}
      fail: {inject: {position_rms: 0.4}}
