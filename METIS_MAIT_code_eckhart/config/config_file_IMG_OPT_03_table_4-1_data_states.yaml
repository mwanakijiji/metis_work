# Pinhole (PH) images for tests/run_IMG_OPT_03_table_4-1.py: the unmodified ScopeSim
# frames of the E-REP-MPIA-1203 Table 4-1 rows, written by
# IMG_OPT_03_METIS_AIT_img_cal_psf_quality_SIM.py (TABLE-4-1 entry of
# config/config_file_IMG_OPT_03_SIM.yaml). Same format as
# config_file_IMG_OPT_03_psf_quality_data_states.yaml, so the ANALYSIS script can also
# be pointed at it (e.g. to measure the reference_strehl of the SIM config).
# Paths are relative to the project stem (METIS_MAIT_code_eckhart/), or absolute

defaults:
  fp_mask: grid_lm
  pp_mask: PPS-LM
  fit_simmed_psf: false
  fit_annular_aperture_free: true
  fit_annular_aperture_fixed: true
  psfs_subset: 1
  fit_method: curve_fit
  config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses.yaml
  results_write_dir: results/IMG_OPT_03_psf_quality_analysis_results/

runs:
  # LM (grid_lm; coord guesses from the defaults)
  - filter_name: HCI_L_short
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_HCI_L_short_SPM-LM_reference.fits
    pp_mask: SPM-LM

  - filter_name: HCI_L_short
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_HCI_L_short_PPS-LM_reference.fits
    pp_mask: PPS-LM

  - filter_name: HCI_L_short
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_HCI_L_short_RLS-LM_reference.fits
    pp_mask: RLS-LM

  - filter_name: Lp
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_Lp_PPS-CFO2_reference.fits
    pp_mask: PPS-CFO2

  - filter_name: IB_4.05
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_IB_4.05_CLS-LM_reference.fits
    pp_mask: CLS-LM

  - filter_name: Mp
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_Mp_CLS-LM_reference.fits
    pp_mask: CLS-LM

  - filter_name: CO_ref
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_CO_ref_CLS-LM_reference.fits
    pp_mask: CLS-LM

  # N (single pinhole_n PSF near the detector centre)
  - filter_name: N1
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_N1_SPM-N_reference.fits
    fp_mask: pinhole_n
    pp_mask: SPM-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  - filter_name: N2
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_N2_CLS-N_reference.fits
    fp_mask: pinhole_n
    pp_mask: CLS-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  - filter_name: N3
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_N3_CLS-N_reference.fits
    fp_mask: pinhole_n
    pp_mask: CLS-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  - filter_name: PAH_8.6
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_PAH_8.6_SPM-N_reference.fits
    fp_mask: pinhole_n
    pp_mask: SPM-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  - filter_name: S_IV
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_S_IV_SPM-N_reference.fits
    fp_mask: pinhole_n
    pp_mask: SPM-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml

  - filter_name: Ne_II
    file_name_abs: data/IMG_OPT_03_psf_quality_simmed_data/IMG_OPT_03_TABLE-4-1_Ne_II_SPM-N_reference.fits
    fp_mask: pinhole_n
    pp_mask: SPM-N
    config_coords_guesses_file_name_abs: /podman-share/metis_work/METIS_MAIT_code_eckhart/config/config_file_IMG_OPT_03_psf_quality_coords_guesses_pinhole_n.yaml
